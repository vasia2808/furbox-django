{% extends "base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static "styles/login.css" %}">
{% endblock css %}

{% block content %}
    <section class="login">
        <h2 class="text-center">Login</h2>
        <hr>
        <form class="login-form" action="{% url "users:login" %}" method="post">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% elif request.POST.next %}
                <input type="hidden" name="next" value="{{ request.POST.next }}">
            {% endif %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control input" id="username" placeholder="Input your username"
                    name="username"
                    value="{% if form.username.value %}{{ form.username.value }}{% endif %}"
                    required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control input" id="password"
                    placeholder="Input your password"
                    name="password"
                    required>
            </div>
            <button type="submit" class="btn btn-outline-primary">Log In</button>
        </form>
        <div class="mt-3">
            <a href="#" class="underline-link">Forgot password?</a> | <a href="{% url "users:registration" %}" class="underline-link">Create account</a>
        </div>
        <hr class="mt-3">
        <div class="text-center">
            <p>Login with:</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a href="#" class="btn btn-outline-white">
                    <img src="{% static "images/login/google.svg" %}" alt="Google Icon" width="16" height="16">
                    Google
                </a>
                <a href="#" class="btn btn-outline-white">
                    <img src="{% static "images/login/facebook.svg" %}" alt="Facebook Icon" width="16" height="16">
                    Facebook
                </a>
                <a href="#" class="btn btn-outline-white">
                    <img src="{% static "images/login/github.svg" %}" alt="GitHub Icon" width="16" height="16">
                    GitHub
                </a>
            </div>
        </div>
    </section>
{% endblock content %}
