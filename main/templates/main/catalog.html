{% extends "base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static "styles/catalog.css" %}">
{% endblock css %}

{% block content %}
    <div class="categories">
        <div class="row g-3">
            
            {% for category in categories %}
                <div class="col-12 col-md-6">
                    <div class="card">
                        <div class="d-flex">
                            <div class="card-image"
                                style="background-image: url('{{ category.image.url }}');">
                            </div>
                            <div class="card-body">
                                <a href="{% url "main:category" category.slug %}" class="card-title">
                                    <h5>{{ category.name }} </h5>
                                </a>
                                <p class="card-text">{{ category.description }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
